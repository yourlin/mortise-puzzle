name: Deploy demo to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 只保留最新一次部署，进行中的不打断
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 校验切割算法与类型
        run: npm run check
      - name: 构建 demo
        # Pages 部署在 /<repo>/ 子路径下，base 要跟着走
        run: npm run build:demo
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
        # 仓库还没开 Pages 时自动开，免得首次部署因为时序而失败
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
